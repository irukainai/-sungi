<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f1c33;--sub:#5b6b84;--line:#dbe3ee;--acc:#3b5bdb;--onacc:#fff;--ok:#0b9a86;--ng:#e0475f;--okbg:#dcf5ef;--ngbg:#fde4e9;--sh:0 1px 2px rgba(15,28,51,.06),0 10px 28px -14px rgba(15,28,51,.25);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1322;--card:#142038;--ink:#e8eef8;--sub:#9fb0c9;--line:#26354f;--acc:#8aa8ff;--onacc:#0b1322;--ok:#3fd1bb;--ng:#ff7388;--okbg:#0f3a31;--ngbg:#431c28;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1322;--card:#142038;--ink:#e8eef8;--sub:#9fb0c9;--line:#26354f;--acc:#8aa8ff;--onacc:#0b1322;--ok:#3fd1bb;--ng:#ff7388;--okbg:#0f3a31;--ngbg:#431c28;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}
:root{--g1:#f28c28;--g2:#38a9e0}
:root[data-theme="gold"]{--bg:#050506;--card:#0e0e10;--ink:#f6f1e3;--sub:#a79f8a;--line:#2b2615;--acc:#f2c94c;--onacc:#0a0a0a;--ok:#f2c94c;--okbg:#2b2308;--ng:#ff5a6e;--ngbg:#2b0e15;--g1:#f2c94c;--g2:#e9e9ee;--sh:0 0 0 1px rgba(212,175,55,.28),0 0 26px -8px rgba(255,255,255,.22);color-scheme:dark}
:root[data-theme="gold"] body{background:radial-gradient(130% 55% at 50% -8%,rgba(255,255,255,.13),transparent 62%),radial-gradient(90% 40% at 100% 100%,rgba(212,175,55,.10),transparent 60%),#050506;background-attachment:fixed}
:root[data-theme="gold"] .ttl,:root[data-theme="gold"] .big,:root[data-theme="gold"] .cs{background:linear-gradient(180deg,#fff7d8,#f2c94c 55%,#b8891b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,255,255,.28))}
:root[data-theme="gold"] .ttl small,:root[data-theme="gold"] .big small{-webkit-text-fill-color:var(--sub);filter:none}
:root[data-theme="gold"] .go,:root[data-theme="gold"] .nx{background:linear-gradient(180deg,#ffe58a,#d4af37 60%,#a97c14);color:#1a1405;box-shadow:0 0 24px rgba(242,201,76,.45),inset 0 1px 0 rgba(255,255,255,.7)}
:root[data-theme="gold"] .card,:root[data-theme="gold"] .q,:root[data-theme="gold"] .opt,:root[data-theme="gold"] .kopt,:root[data-theme="gold"] .zc,:root[data-theme="gold"] .fb{border-color:rgba(212,175,55,.3)}
:root[data-theme="gold"] #tabs{background:rgba(8,8,9,.92);border-top:1px solid rgba(212,175,55,.5);box-shadow:0 -10px 34px rgba(255,255,255,.06)}
:root[data-theme="gold"] #tabs button.on{background:rgba(212,175,55,.12);text-shadow:0 0 12px rgba(242,201,76,.8)}
:root[data-theme="gold"] .opt.ok,:root[data-theme="gold"] .kopt.ok,:root[data-theme="gold"] .fb.ok{box-shadow:0 0 22px rgba(242,201,76,.4)}
:root[data-theme="gold"] .opt.ng,:root[data-theme="gold"] .kopt.ng,:root[data-theme="gold"] .fb.ng{box-shadow:0 0 18px rgba(255,90,110,.35)}
:root[data-theme="gold"] .chip.on{color:#1a1405;box-shadow:0 0 16px rgba(242,201,76,.35)}
:root[data-theme="gold"] .t.cur{background:#fff;box-shadow:0 0 8px #fff}
:root[data-theme="gold"] .zbar i,:root[data-theme="gold"] .bar .fl{background:linear-gradient(90deg,#b8891b,#f2c94c,#fff7d8);box-shadow:0 0 10px rgba(242,201,76,.6)}
:root[data-theme="gold"] svg circle{filter:drop-shadow(0 0 4px rgba(255,255,255,.85))}
:root[data-theme="gold"] svg path{filter:drop-shadow(0 0 2px rgba(255,255,255,.35))}
#mode{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:30;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--acc);font-family:'Dela Gothic One',sans-serif;font-size:15px;cursor:pointer;box-shadow:var(--sh)}
:root[data-theme="gold"] #mode{border-color:rgba(242,201,76,.7);box-shadow:0 0 16px rgba(242,201,76,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:20px 16px 116px}
button{font:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,.big,.zn,.zg,.cs{font-family:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;font-weight:400}
.ttl{font-size:30px;line-height:1.2;margin:6px 4px 18px}.ttl small{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:700;color:var(--sub);margin-top:6px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.lab{font-size:13px;font-weight:900;color:var(--sub);margin:0 0 10px;letter-spacing:.04em}
.sub{color:var(--sub);margin:0 0 12px;font-size:14px}
.note{font-size:12px;color:var(--sub);margin:6px 4px 14px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--sub);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.go,.nx{display:block;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--onacc);font-weight:900;font-size:18px;cursor:pointer;margin:0 0 10px;box-shadow:0 10px 22px -10px var(--acc)}
.ghost{display:block;width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--cc,var(--line));background:transparent;color:var(--ink);padding:8px 14px;min-height:40px;border-radius:14px;font-weight:700;font-size:14px;text-align:left;cursor:pointer}
.chip small{opacity:.7}.chip.on{background:var(--cc,var(--ink));color:#10213a}.chip:disabled{opacity:.45}
.big{font-size:64px;line-height:1;margin:0 0 4px}.big small{font-size:16px;color:var(--sub);margin-left:6px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700}
#tabs{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
#tabs button{flex:1;max-width:180px;height:48px;border:0;border-radius:14px;background:transparent;color:var(--sub);font-weight:900;font-size:15px;cursor:pointer}
#tabs button.on{background:var(--bg);color:var(--acc)}
.cs{font-size:22px;margin:0 0 10px}
input[type=range]{width:100%;height:32px;accent-color:var(--acc)}
svg{display:block;max-width:100%}
#tip:empty{display:none}#tip{font-weight:700;font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px;margin:12px 0 0}
#cd .go{margin-bottom:14px}
#cl,#un{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}#un:empty{display:none}
.bands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bdb{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:52px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:8px solid var(--bc);border-radius:14px;padding:8px 12px;cursor:pointer}
.bdb.on{border-color:var(--bc);background:var(--bg)}.bdb span{font-weight:700;color:var(--sub)}
.bl{margin-bottom:6px}.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row span:nth-child(2){flex:1}
details{color:var(--sub);font-size:13px}.nm{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.nm span{border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.cal div{background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column}.cal b{font-size:11px;line-height:1.3}.cal span{font-family:'Dela Gothic One',sans-serif;font-size:24px}.cal small{color:var(--sub)}
.weak{background:var(--ngbg);border:2px solid var(--ng);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.gauge{display:flex;gap:4px;margin-bottom:14px}.t{flex:1;height:8px;border-radius:99px;background:var(--line)}.t.ok{background:var(--ok)}.t.ng{background:var(--ng)}.t.cur{background:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}.meta b{color:var(--acc);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.q{font-size:19px;line-height:1.6;font-weight:900;margin:0 0 16px;background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.opts{display:grid;gap:10px;counter-reset:o}
.opt{counter-increment:o;display:grid;grid-template-columns:30px 1fr;align-items:center;text-align:left;min-height:56px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:var(--sh)}
.opt::before{content:counter(o,upper-alpha);width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--sub)}
.opt small{grid-column:2;display:block;font-weight:400;font-size:13px;margin-top:4px;color:var(--sub)}
.opt.pk{border-color:var(--acc);background:var(--bg)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ng{background:var(--ngbg);border-color:var(--ng)}.opt.dim{opacity:.8}
.fb{margin-top:14px;border-radius:20px;padding:16px;background:var(--card);border:2px solid var(--line);box-shadow:var(--sh);animation:pop .22s ease-out}
.fb.ok{border-color:var(--ok)}.fb.ng{border-color:var(--ng)}.fb .v{font-weight:900;font-size:18px;margin:0 0 6px}.fb.ok .v{color:var(--ok)}.fb.ng .v{color:var(--ng)}.fb p{margin:0 0 12px}.fb .nx{margin:0}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cf button{min-height:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-weight:900;font-size:16px;cursor:pointer}.cf button:nth-child(3){grid-column:1/-1;border-color:var(--ng);color:var(--ng)}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.rank{font-weight:900;font-size:20px;margin:0 0 20px}

async function saveNow(){

 }catch(e){acc.st='off';acc.err=(e&&e.code)||'';acRefresh()}
}
